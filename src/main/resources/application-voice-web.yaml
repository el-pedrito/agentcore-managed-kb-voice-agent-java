# Profile "voice-web": voice in the browser. The demo screen (demo-ui, port 8090) streams the
# microphone to ws://127.0.0.1:8082/voice. Local demo only: 127.0.0.1, demo screen origin only,
# no authentication. Port 8082: 8080 is demo 1, 8081 the local agent.
server:
  address: 127.0.0.1
  port: ${VOICE_WEB_PORT:8082}

voice:
  region: ${VOICE_REGION:eu-north-1}
  model-id: ${VOICE_MODEL_ID:amazon.nova-2-sonic-v1:0}
  voice-id: ${VOICE_ID:florian}
  # Only the demo screen may open the WebSocket.
  allowed-origins: ${VOICE_ALLOWED_ORIGINS:http://127.0.0.1:8090,http://localhost:8090}

logging:
  level:
    root: WARN
    com.example.techagent: INFO
    software.amazon.awssdk.profiles: ERROR
